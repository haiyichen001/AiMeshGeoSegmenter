<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><title>Validate</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;overflow:hidden;font-family:Arial}
#navbar{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;background:#111;border-bottom:1px solid #333}
#navbar a{padding:8px 16px;color:#ccc;text-decoration:none;font-size:13px}
#navbar a.active{color:#4db8ff;background:#1a1a1a}
#toolbar{position:fixed;top:35px;left:8px;right:8px;z-index:100;display:flex;gap:8px;align-items:center}
#toolbar select,#toolbar button{padding:6px 12px;font-size:13px;background:#1a1a1a;color:#ccc;border:1px solid #444;border-radius:4px;cursor:pointer}
#toolbar button:hover{background:#2a2a2a;color:#fff}
#main{display:flex;width:100%;height:100vh;padding-top:70px}
.panel{flex:1;position:relative;border:1px solid #222}
.panel .label{position:absolute;top:4px;left:4px;color:#fff;font-size:12px;background:rgba(0,0,0,0.9);padding:4px 10px;border-radius:3px;z-index:100;pointer-events:none}
.panel .legend{position:absolute;bottom:4px;left:4px;color:#ccc;font-size:11px;z-index:100;display:flex;gap:8px;flex-wrap:wrap;background:rgba(0,0,0,0.7);padding:4px 8px;border-radius:3px}
.panel .legend span{margin-right:4px}
#loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:16px;z-index:200;display:none}
#score{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);color:#4db8ff;font-size:14px;z-index:200;background:rgba(0,0,0,0.9);padding:6px 16px;border-radius:4px;display:none}
</style></head><body>
<div id="navbar">
  <a href="/">Compare</a><a href="/labels">Labels</a><a href="/infer">Infer</a><a href="/model">Model</a><a href="/validate" class="active">Validate</a>
</div>
<div id="toolbar">
  <select id="partSelect"></select>
  <button id="btnLoad">Load Answer</button>
  <button id="btnInfer">Run Inference</button>
</div>
<div id="main">
  <div class="panel" id="panelLeft"><div class="label">Ground Truth (Answer)</div><div class="legend" id="legendLeft"></div></div>
  <div class="panel" id="panelRight"><div class="label">Prediction (Model)</div><div class="legend" id="legendRight"></div></div>
</div>
<div id="loading">Loading...</div>
<div id="score"></div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const COLORS = {
  plane:0x4db8ff, cylinder:0x44cc44, sphere:0xff44ff, cone:0xff8844,
  torus:0xffcc00, fillet:0x00cccc, chamfer:0xff6644, freeform:0x888888
};

let sceneL, sceneR, rendererL, rendererR, camL, camR, ctrlL, ctrlR, groupL, groupR;

function initScene(panelId, side) {
  const panel = document.getElementById(panelId);
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0a0a0a);
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(panel.clientWidth, panel.clientHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  panel.appendChild(renderer.domElement);
  const cam = new THREE.PerspectiveCamera(35, panel.clientWidth/panel.clientHeight, 0.001, 1000);
  cam.position.set(1,0.6,1.5); cam.up.set(0,0,1);
  const ctrl = new OrbitControls(cam, renderer.domElement); ctrl.enableDamping=true;
  scene.add(new THREE.AmbientLight(0xffffff,3));
  const d1 = new THREE.DirectionalLight(0xffffff,3); d1.position.set(1,1,1); scene.add(d1);
  const d2 = new THREE.DirectionalLight(0x8888cc,2); d2.position.set(-0.5,-0.5,-0.5); scene.add(d2);
  const group = new THREE.Group(); scene.add(group);
  return {scene,renderer,cam,ctrl,group};
}

function renderFaces(group, faces, legendId) {
  while(group.children.length > 0) { const c = group.children[0]; if(c.geometry)c.geometry.dispose(); if(c.material)c.material.dispose(); group.remove(c); }
  const legend = document.getElementById(legendId);
  const counts = {};
  faces.forEach(f => { counts[f.type] = (counts[f.type]||0)+1; });
  legend.innerHTML = Object.entries(counts).map(([k,v]) => `<span style="color:#${COLORS[k]?.toString(16).padStart(6,'0')}">${k}:${v}</span>`).join(' ');
  faces.forEach(f => {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(f.vertices, 3));
    geo.setIndex(f.triangles); geo.computeVertexNormals();
    const mat = new THREE.MeshPhongMaterial({
      color: COLORS[f.type]||0xffffff, specular:0, shininess:0,
      side: THREE.DoubleSide, transparent:true, opacity:0.5, depthWrite:false
    });
    group.add(new THREE.Mesh(geo, mat));
  });
  const allVerts = faces.flatMap(f => f.vertices);
  if (allVerts.length > 0) {
    let cx=0,cy=0,cz=0,n=allVerts.length/3;
    for(let i=0;i<allVerts.length;i+=3){cx+=allVerts[i];cy+=allVerts[i+1];cz+=allVerts[i+2];}
    return {cx:cx/n,cy:cy/n,cz:cz/n};
  }
  return {cx:0,cy:0,cz:0};
}

async function loadAnswer(part) {
  document.getElementById('loading').style.display='block';
  document.getElementById('score').style.display='none';
  const r = await fetch(`/api/answer/${part}`);
  const d = await r.json();
  if (d.error) { alert(d.error); document.getElementById('loading').style.display='none'; return; }
  const c = renderFaces(groupL, d.faces, 'legendLeft');
  camL.position.set(c.cx+d.span*0.6, c.cy+d.span*0.4, c.cz+d.span*0.7);
  ctrlL.target.set(c.cx, c.cy, c.cz); ctrlL.update();
  document.getElementById('loading').style.display='none';
}

async function runInfer(part) {
  document.getElementById('loading').style.display='block';
  document.getElementById('score').style.display='none';
  const r = await fetch(`/api/compare/${part}`);
  const d = await r.json();
  if (d.error) { alert(d.error); document.getElementById('loading').style.display='none'; return; }
  const c = renderFaces(groupR, d.pred.faces, 'legendRight');
  camR.position.set(c.cx+d.pred.span*0.6, c.cy+d.pred.span*0.4, c.cz+d.pred.span*0.7);
  ctrlR.target.set(c.cx, c.cy, c.cz); ctrlR.update();
  document.getElementById('score').style.display='block';
  document.getElementById('score').textContent = `Accuracy: ${(d.face_acc*100).toFixed(1)}% | Patch ratio: ${d.n_pred}/${d.n_gt}`;
  document.getElementById('loading').style.display='none';
}

async function init() {
  const L = initScene('panelLeft', 'L'); sceneL=L.scene; rendererL=L.renderer; camL=L.cam; ctrlL=L.ctrl; groupL=L.group;
  const R = initScene('panelRight', 'R'); sceneR=R.scene; rendererR=R.renderer; camR=R.cam; ctrlR=R.ctrl; groupR=R.group;

  // Load part list from answers
  const partsR = await fetch('/api/answer_parts');
  const parts = await partsR.json();
  const sel = document.getElementById('partSelect');
  parts.forEach(p => { const o = document.createElement('option'); o.value = p; o.textContent = p; sel.appendChild(o); });
  document.getElementById('btnLoad').addEventListener('click', () => loadAnswer(sel.value));
  document.getElementById('btnInfer').addEventListener('click', () => runInfer(sel.value));
  if (parts.length > 0) { sel.value = parts[0]; loadAnswer(parts[0]); }

  function animate() {
    requestAnimationFrame(animate);
    ctrlL.update(); rendererL.render(sceneL, camL);
    ctrlR.update(); rendererR.render(sceneR, camR);
  }
  animate();
  window.addEventListener('resize', () => {
    [rendererL, rendererR].forEach((r,i) => {
      const p = document.getElementById(i===0?'panelLeft':'panelRight');
      r.setSize(p.clientWidth, p.clientHeight);
      (i===0?camL:camR).aspect = p.clientWidth/p.clientHeight;
      (i===0?camL:camR).updateProjectionMatrix();
    });
  });
}
init();
</script></body></html>
