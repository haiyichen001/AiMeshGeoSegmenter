<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Face Type Labels</title>
<link rel="stylesheet" href="/theme.css"><style>
#toolbar { position:fixed; top:36px; right:16px; z-index:100; }
#legend { position:fixed; top:36px; left:16px; z-index:100; flex-direction:column; background:rgba(0,0,0,0.8); padding:8px 12px; border-radius:6px; }
.label-line { position:absolute; pointer-events:none; z-index:50; }
</style>
</head>
<body>
<div id="navbar">
  <a href="/">Compare</a>
  <a href="/labels" class="active">Labels</a>
  <a href="/model">Model</a>
  <a href="/infer">Infer</a>
</div>
<div id="toolbar">
  <select id="partSelect" style="padding:6px 12px;font-size:13px;background:#1a1a1a;color:#ccc;border:1px solid #444;border-radius:4px"></select>
  <button id="btnReload">Reload</button>
</div>
<div id="legend"></div>
<div id="info"></div>
<div id="loading">Loading...</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const BASE = '';
let scene, renderer, cam, ctrl, group;

function initScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a0a);
  const w = window.innerWidth, h = window.innerHeight;
  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(w,h); renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  document.body.appendChild(renderer.domElement);
  cam = new THREE.PerspectiveCamera(35,w/h,0.001,100000);
  cam.position.set(1,0.6,1.5); cam.up.set(0,0,1);
  ctrl = new OrbitControls(cam, renderer.domElement);
  ctrl.enableDamping = true; ctrl.dampingFactor = 0.12; ctrl.target.set(0,0,0);
  scene.add(new THREE.AmbientLight(0xffffff,3));
  const d1 = new THREE.DirectionalLight(0xffffff,5); d1.position.set(1,1,1); scene.add(d1);
  group = new THREE.Group(); scene.add(group);
  window.addEventListener('resize',()=>{
    renderer.setSize(window.innerWidth, window.innerHeight);
    cam.aspect = window.innerWidth/window.innerHeight; cam.updateProjectionMatrix();
  });
}

function clearGroup() {
  while(group.children.length > 0) {
    const c = group.children[0];
    if (c.geometry) c.geometry.dispose();
    if (c.material) { if (Array.isArray(c.material)) c.material.forEach(m=>m.dispose()); else c.material.dispose(); }
    group.remove(c);
  }
}

async function load(part) {
  document.getElementById('loading').style.display = 'block';
  clearGroup();
  try {
    const r = await fetch(`${BASE}/api/labels/${part}`);
    if (!r.ok) { console.error('Failed'); return; }
    const d = await r.json();

    // Legend: always show all 6 classes
    const ALL_COLORS = {"plane":"#4db8ff","cylinder":"#44cc44","sphere":"#ff44ff","cone":"#ff8844","torus":"#ffcc00","freeform":"#888888"};
    const counts = {};
    d.faces.forEach(f=>{ counts[f.type] = (counts[f.type]||0)+1; });
    const legend = document.getElementById('legend');
    legend.innerHTML = Object.entries(ALL_COLORS).map(([t,c])=>
      `<div style="display:flex;align-items:center;gap:6px;background:rgba(0,0,0,0.7);padding:2px 6px;border-radius:3px"><span style="width:12px;height:12px;border-radius:2px;background:${c}"></span><span style="color:#ccc;font-size:10px">${t} (${counts[t]||0})</span></div>`
    ).join('');

    // Render faces
    d.faces.forEach(f=>{
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(f.vertices,3));
      geo.setIndex(f.triangles);
      geo.computeVertexNormals();
      const mat = new THREE.MeshPhongMaterial({
        color: new THREE.Color(f.color), specular: 0x222222, shininess: 30,
        side: THREE.DoubleSide, flatShading: true
      });
      group.add(new THREE.Mesh(geo, mat));
    });

    cam.position.set(d.center[0]+d.span*0.6, d.center[1]+d.span*0.4, d.center[2]+d.span*0.7);
    ctrl.target.set(...d.center); ctrl.update();
    document.getElementById('info').textContent = `${part} | ${d.faces.length} faces`;
  } catch(e) { console.error(e); }
  document.getElementById('loading').style.display = 'none';
}

function animate() { requestAnimationFrame(animate); ctrl.update(); renderer.render(scene,cam); }

async function init() {
  initScene(); animate();
  // TEMP: sphere-only parts for review
  const r = await fetch(`${BASE}/api/parts_sphere`);
  const parts = await r.json();
  const sel = document.getElementById('partSelect');
  parts.forEach(p => { const o = document.createElement('option'); o.value = p; o.textContent = p; sel.appendChild(o); });
  const def = parts[Math.floor(Math.random()*parts.length)];
  if(def) sel.value = def;
  sel.addEventListener('change',()=>load(sel.value));
  document.getElementById('btnReload').addEventListener('click',()=>load(sel.value));
  await load(sel.value);
}
init();
</script>
</body>
</html>
