<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><title>Model</title>
<link rel="stylesheet" href="/theme.css"><style>
body { overflow-y: auto; }
.dashboard { max-width: 1100px; margin: 56px auto 40px; padding: 0 24px; display: flex; flex-direction: column; gap: 20px; }
h2 { color: var(--accent); font-size: 18px; margin: 0; }
h3 { color: var(--text-secondary); font-size: 13px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: 1px; }
.metrics { display: flex; gap: 12px; flex-wrap: wrap; }
.metric { padding: 14px 20px; background: var(--bg-tertiary); border-radius: 8px; text-align: center; min-width: 90px; border: 1px solid var(--border); }
.metric .val { font-size: 24px; font-weight: 700; color: var(--accent); font-family: var(--font-mono); }
.metric .val.green { color: #22c55e; }
.metric .val.orange { color: #f59e0b; }
.metric .label { font-size: 10px; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--text-muted); font-weight: 500; padding: 8px 12px; border-bottom: 1px solid var(--border); }
td { padding: 8px 12px; color: var(--text-primary); border-bottom: 1px solid var(--bg-tertiary); font-family: var(--font-mono); }
.bar { height: 6px; border-radius: 3px; background: var(--bg-tertiary); overflow: hidden; width: 100%; }
.bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s; }
.fold-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
.fold-cell { background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 6px; padding: 10px 8px; text-align: center; }
.fold-cell .seed { color: var(--text-muted); font-size: 9px; text-transform: uppercase; }
.fold-cell .acc { font-size: 15px; font-weight: 700; font-family: var(--font-mono); }
.fold-cell .fnum { font-size: 10px; color: var(--text-secondary); }
.nodata { color: var(--text-muted); font-size: 14px; padding: 40px; text-align: center; }
.class-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.class-name { width: 80px; font-size: 12px; font-family: var(--font-mono); }
.class-bar-wrap { flex: 1; }
.class-pct { width: 60px; font-size: 12px; font-family: var(--font-mono); text-align: right; }
</style></head><body>
<div id="navbar">
  <a href="/">Compare</a><a href="/labels">Labels</a>
  <a href="/model" class="active">Model</a><a href="/infer">Infer</a>
</div>
<div class="dashboard" id="root"><div class="nodata">Loading...</div></div>
<script>
const COLORS = ['#06b6d4','#f59e0b','#22c55e','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316','#6366f1'];
const T = getComputedStyle(document.documentElement).getPropertyValue('--text-muted')?.trim()||'#666';
const TC = getComputedStyle(document.documentElement).getPropertyValue('--text-secondary')?.trim()||'#999';

function bar(v, max, color) {
  const pct = Math.max(2, (v/max)*100);
  return `<div class="bar"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>`;
}

function render(gat, ens) {
  if (!gat && !ens) return '<div class="nodata">No training data yet.</div>';

  let h = '<div class="card" style="padding:20px"><h2>'+((gat&&gat.model)||'TriangleGAT')+'</h2>';

  // Top metrics
  h += '<div class="metrics" style="margin:16px 0">';
  if (ens && ens.test_acc != null) h += `<div class="metric"><div class="val green">${(ens.test_acc*100).toFixed(2)}%</div><div class="label">Test Acc</div></div>`;
  if (gat && gat.mean != null) h += `<div class="metric"><div class="val">${(gat.mean*100).toFixed(2)}%</div><div class="label">CV Mean</div></div>`;
  if (gat && gat.k) h += `<div class="metric"><div class="val">${gat.k}-fold</div><div class="label">CV</div></div>`;
  if (gat && gat.params) h += `<div class="metric"><div class="val">${(gat.params/1000).toFixed(0)}K</div><div class="label">Params</div></div>`;
  if (gat && gat.batch_size) h += `<div class="metric"><div class="val">${gat.batch_size}</div><div class="label">Batch</div></div>`;
  if (ens && ens.cv_folds) h += `<div class="metric"><div class="val">${ens.cv_folds}×${ens.ensemble_seeds?.length||3}</div><div class="label">Ensemble</div></div>`;
  if (gat && gat.epochs) h += `<div class="metric"><div class="val">${gat.epochs}</div><div class="label">Epochs</div></div>`;
  if (ens && ens.train_time_s) {
    const mins = Math.round(ens.train_time_s/60);
    h += `<div class="metric"><div class="val orange">${mins}min</div><div class="label">Train Time</div></div>`;
  }
  h += '</div>';

  // Per-class accuracy
  if (ens && ens.per_class) {
    h += '<h3>Per-Class Accuracy</h3>';
    const classes = Object.entries(ens.per_class);
    classes.forEach(([name, info]) => {
      const pct = (info.acc*100).toFixed(1);
      const color = {'plane':'#4db8ff','cylinder':'#44cc44','sphere':'#ff44ff','cone':'#ff8844','torus':'#ffcc00','freeform':'#888888'}[name]||'#ccc';
      const total = info.total?.toLocaleString()||'';
      h += `<div class="class-row"><span class="class-name" style="color:${color}">${name}</span><span class="class-bar-wrap">${bar(info.acc, 1, color)}</span><span class="class-pct" style="color:${color}">${pct}%</span></div>`;
    });
  }

  // Fold accuracies
  if (ens && ens.fold_results && ens.fold_results.length) {
    h += '<h3 style="margin-top:16px">Fold Results</h3>';
    h += '<div class="fold-grid">';
    const seeds = [...new Set(ens.fold_results.map(f=>f.seed))].sort();
    seeds.forEach(seed => {
      const folds = ens.fold_results.filter(f=>f.seed===seed);
      const avg = folds.reduce((s,f)=>s+f.best_val,0)/folds.length;
      const ci = COLORS[seed%COLORS.length];
      h += `<div class="fold-cell"><div class="seed">Seed ${seed}</div>`;
      folds.forEach(f=>{
        h += `<div class="acc" style="color:${ci}">${(f.best_val*100).toFixed(1)}%</div><div class="fnum">F${f.fold}</div>`;
      });
      h += `<div style="font-size:11px;color:${T};margin-top:4px">avg ${(avg*100).toFixed(1)}%</div></div>`;
    });
    h += '</div>';
  } else if (gat && gat.fold_accuracies && gat.fold_accuracies.length) {
    h += '<h3 style="margin-top:16px">Fold Accuracies</h3>';
    const maxA = Math.max(...gat.fold_accuracies, 0.5);
    h += '<div class="fold-grid">';
    gat.fold_accuracies.forEach((a,i)=>{
      const ci = COLORS[i%COLORS.length];
      h += `<div class="fold-cell"><div class="acc" style="color:${ci}">${(a*100).toFixed(1)}%</div><div class="fnum">F${i+1}</div></div>`;
    });
    h += '</div>';
  }

  h += '</div>';
  return h;
}

(async () => {
  try {
    const [r1, r2] = await Promise.all([
      fetch('/api/model_log/gat').then(r=>r.ok?r.json():null),
      fetch('/api/model_log/ensemble').then(r=>r.ok?r.json():null)
    ]);
    document.getElementById('root').innerHTML = render(r1, r2);
  } catch {
    document.getElementById('root').innerHTML = '<div class="nodata">Failed to load.</div>';
  }
})();
</script></body></html>
