<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><title>Model</title>
<link rel="stylesheet" href="/theme.css"><style>
body { overflow-y: auto; }
.dash { max-width: 1500px; margin: 52px auto 48px; padding: 0 24px; }
h2 { font-size: 18px; color: var(--accent); margin: 0 0 8px; }
h3 { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin: 16px 0 6px; }
.kpi { display: flex; gap: 10px; flex-wrap: wrap; margin: 8px 0; }
.kpi>div { background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 7px; padding: 10px 14px; text-align: center; min-width: 60px; }
.kpi .n { font-size: 22px; font-weight: 700; font-family: var(--font-mono); color: var(--accent); }
.kpi .n.g { color: #22c55e; }
.kpi .n.o { color: #f59e0b; }
.kpi .l { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 16px; }
.bar { height: 7px; border-radius: 4px; background: var(--bg-secondary); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; }
.cr { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
.cr .nm { width: 64px; font-size: 11px; font-family: var(--font-mono); }
.cr .bw { flex:1; }
.cr .pv { width: 48px; text-align: right; font-size: 11px; font-family: var(--font-mono); }
.fg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.fc { background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 6px; padding: 8px; text-align: center; }
.fc .fv { font-size: 14px; font-weight: 700; font-family: var(--font-mono); }
.fc .fl { font-size: 9px; color: var(--text-secondary); }
table { width: 100%; border-collapse: collapse; font-size: 11px; margin: 6px 0; }
td { padding: 4px 8px; border-bottom: 1px solid var(--bg-tertiary); font-family: var(--font-mono); }
td:first-child { color: var(--text-secondary); font-family: inherit; width: 90px; }
td+td { color: var(--text-primary); }
.nodata { color: var(--text-muted); padding: 60px; text-align: center; }
svg text { font-family: system-ui, sans-serif; }
</style></head><body>
<div id="navbar">
  <a href="/">Compare</a><a href="/labels">Labels</a>
  <a href="/model" class="active">Model</a><a href="/infer">Infer</a>
</div>
<div class="dash" id="root"><div class="nodata">Loading...</div></div>
<script>
const C = ['#06b6d4','#f59e0b','#22c55e','#ef4444','#8b5cf6','#ec4899'];
const TM = getComputedStyle(document.documentElement).getPropertyValue('--text-muted')?.trim()||'#666';

function render(gat, ens, mlp) {
  if (!ens) return '<div class="nodata">No training data.</div>';
  let h = '';

  // ── TOP: Pipeline Diagram ──
  h += `<div style="text-align:center;margin-bottom:24px">`;
  h += `<svg viewBox="0 0 860 100" style="width:100%;max-width:860px"><defs><marker id="a" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,1 L5,2.5 L0,4 Z" fill="#64748b"/></marker></defs>
    <rect x="5" y="25" width="100" height="46" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="55" y="44" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">STL Mesh</text>
    <text x="55" y="60" text-anchor="middle" fill="#64748b" font-size="10">triangles</text>
    <line x1="105" y1="48" x2="145" y2="48" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="150" y="10" width="200" height="72" rx="6" fill="#0c1929" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="250" y="30" text-anchor="middle" fill="#06b6d4" font-size="13" font-weight="700">GAT Classifier</text>
    <text x="250" y="46" text-anchor="middle" fill="#94a3b8" font-size="10">3-layer + JK, 192hx4</text>
    <text x="250" y="60" text-anchor="middle" fill="#94a3b8" font-size="10">26-dim feat, 919K params</text>
    <text x="250" y="76" text-anchor="middle" fill="#06b6d4" font-size="10">87.9% test</text>
    <line x1="350" y1="48" x2="390" y2="48" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="395" y="15" width="160" height="62" rx="6" fill="#0c1929" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="475" y="34" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="700">MLP Edge</text>
    <text x="475" y="50" text-anchor="middle" fill="#94a3b8" font-size="10">4→64→32→16→1</text>
    <text x="475" y="64" text-anchor="middle" fill="#f59e0b" font-size="10">95.4% test, 2.9K</text>
    <line x1="555" y1="48" x2="595" y2="48" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="600" y="22" width="110" height="46" rx="6" fill="#0c1929" stroke="#22c55e" stroke-width="1.5"/>
    <text x="655" y="40" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="700">CC + Vote</text>
    <text x="655" y="56" text-anchor="middle" fill="#22c55e" font-size="10">area-weighted</text>
    <line x1="710" y1="48" x2="755" y2="48" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

    <text x="785" y="30" text-anchor="middle" fill="#8b5cf6" font-size="11" font-weight="700">6-class</text>
    <text x="785" y="48" text-anchor="middle" fill="#8b5cf6" font-size="11" font-weight="700">per-face</text>
    <text x="785" y="66" text-anchor="middle" fill="#64748b" font-size="10">output</text>
  </svg></div>`;

  // ── TWO COLUMNS ──
  h += '<div class="cols">';

  // LEFT: GAT
  h += '<div class="card" style="padding:16px"><h2>GAT Classifier</h2>';
  // KPI: 3 tags
  h += '<div class="kpi">';
  h += `<div><div class="n g">${ens.test_acc != null ? (ens.test_acc*100).toFixed(1)+'%' : 'N/A'}</div><div class="l">Accuracy</div></div>`;
  h += `<div><div class="n">${gat && gat.params ? (gat.params/1000).toFixed(0)+'K' : '919K'}</div><div class="l">Params</div></div>`;
  h += `<div><div class="n o">${ens.train_time_s ? Math.round(ens.train_time_s/60)+'m' : '439m'}</div><div class="l">Time</div></div>`;
  h += '</div>';
  // Config
  h += '<h3>Config</h3><table>';
  h += '<tr><td>Architecture</td><td>3 GATConv + JK, 192h x4 heads</td></tr>';
  h += '<tr><td>Input</td><td>26-dim: normals(3) + Fourier(12) + geom(11) + edge(3)</td></tr>';
  h += '<tr><td>Loss</td><td>Focal Loss (γ=2) + class-balanced weights</td></tr>';
  h += '<tr><td>Optimizer</td><td>AdamW, lr=0.002, warmup 25ep + Cosine LR</td></tr>';
  h += '<tr><td>Regularization</td><td>DropEdge 15%, Dropout 0.3, SWA, AMP</td></tr>';
  h += '<tr><td>Data</td><td>13,931 train / 2,985 val / 2,986 test</td></tr>';
  h += '</table>';
  // Training Curve
  h += '<h3>Training Curve</h3>';
  h += '<div style="color:var(--text-muted);font-size:11px;padding:12px;text-align:center;background:var(--bg-tertiary);border-radius:6px">Per-epoch log not saved for ensemble training.<br>Next run will capture loss/val curves.</div>';
  // Per-Class
  h += '<h3>Per-Class Accuracy</h3>';
  if (ens.per_class) {
    Object.entries(ens.per_class).forEach(([n,i])=>{
      const p=(i.acc*100).toFixed(1);
      const cl={'plane':'#4db8ff','cylinder':'#44cc44','sphere':'#ff44ff','cone':'#ff8844','torus':'#ffcc00','freeform':'#888888'}[n]||'#ccc';
      h += `<div class="cr"><span class="nm" style="color:${cl}">${n}</span><span class="bw"><div class="bar"><div class="bar-fill" style="width:${Math.max(2,i.acc*100)}%;background:${cl}"></div></div></span><span class="pv" style="color:${cl}">${p}%</span></div>`;
    });
  }
  // Folds
  h += '<h3>Fold Results (3 seeds x3 folds)</h3><div class="fg">';
  if (ens.fold_results) {
    ens.fold_results.forEach(f=>{
      h += `<div class="fc"><div class="fl">S${f.seed}F${f.fold}</div><div class="fv" style="color:${C[f.fold%6]}">${(f.best_val*100).toFixed(1)}%</div></div>`;
    });
  }
  h += '</div></div>'; // end left

  // RIGHT: MLP
  h += '<div class="card" style="padding:16px"><h2>MLP Edge Classifier</h2>';
  // KPI: 3 tags
  h += '<div class="kpi">';
  h += `<div><div class="n g">${mlp && mlp.best_acc != null ? (mlp.best_acc*100).toFixed(1)+'%' : '95.4%'}</div><div class="l">Accuracy</div></div>`;
  h += `<div><div class="n">${mlp && mlp.params ? (mlp.params/1000).toFixed(1)+'K' : '2.9K'}</div><div class="l">Params</div></div>`;
  h += `<div><div class="n o">47s</div><div class="l">Time</div></div>`;
  h += '</div>';
  // Config
  h += '<h3>Config</h3><table>';
  h += '<tr><td>Architecture</td><td>4→64→32→16→1, Dropout 0.1</td></tr>';
  h += '<tr><td>Input</td><td>4-dim: angle, area ratio, dist, convexity</td></tr>';
  h += '<tr><td>Output</td><td>Binary: same face (1) or boundary (0)</td></tr>';
  h += '<tr><td>Optimizer</td><td>Adam, lr=0.001, BS=8192, 50 epochs</td></tr>';
  h += '<tr><td>Training data</td><td>3.8M edge pairs from 16K STEP files</td></tr>';
  h += '</table>';
  // Training Curve: 3 separate charts, one per MLP model
  if (mlp && mlp.histories && mlp.histories.length > 0) {
    h += '<h3>Training Curve</h3>';
    const LCOL = '#f97316', ACOL = '#22c55e';
    mlp.histories.forEach((h,si)=>{
      const loss=h.history.loss, acc=h.history.acc, n=loss.length;
      if (n<2) return;
      let lmax=-Inf,lmin=Inf,amax=-Inf,amin=Inf;
      loss.forEach(v=>{if(v<lmin)lmin=v;if(v>lmax)lmax=v;});
      acc.forEach(v=>{if(v<amin)amin=v;if(v>amax)amax=v;});
      lmax*=1.05;lmin*=0.95; amax*=1.02;amin*=0.95;
      const lr=lmax-lmin||1, ar=amax-amin||1;
      h+=`<div style="font-size:10px;color:var(--text-muted);margin:8px 0 2px">Model ${si+1} (seed ${h.seed}) — best acc ${(h.best_acc*100).toFixed(1)}%</div>`;
      h+=`<svg viewBox="0 0 600 140" style="width:100%;background:var(--bg-tertiary);border-radius:4px">`;
      const M={t:14,r:50,b:20,l:42}, pw=600-M.l-M.r, ph=140-M.t-M.b;
      const lys=v=>M.t+ph*(1-(v-lmin)/lr);
      const ays=v=>M.t+ph*(1-(v-amin)/ar);
      const xs=i=>M.l+(pw/Math.max(n-1,1))*i;
      // Grid
      for(let i=0;i<=4;i++){const y=M.t+ph*i/4;h+=`<line x1="${M.l}" y1="${y}" x2="${600-M.r}" y2="${y}" stroke="var(--bg-secondary)" stroke-width="0.5"/>`;}
      // Y labels
      for(let i=0;i<=4;i++){const y=M.t+ph*i/4;h+=`<text x="${M.l-4}" y="${y+4}" fill="${LCOL}" font-size="9" text-anchor="end">${(lmax-(lmax-lmin)*i/4).toFixed(2)}</text>`;h+=`<text x="${600-M.r+4}" y="${y+4}" fill="${ACOL}" font-size="9">${((amax-(amax-amin)*i/4)*100).toFixed(0)}%</text>`;}
      // X
      for(let i=0;i<n;i+=Math.max(1,Math.floor(n/6)))h+=`<text x="${xs(i)}" y="${140-4}" fill="#64748b" font-size="8" text-anchor="middle">${i+1}</text>`;
      // Lines
      const lp=loss.map((v,i)=>(i===0?'M':'L')+xs(i).toFixed(1)+','+lys(v).toFixed(1)).join('');
      const ap=acc.map((v,i)=>(i===0?'M':'L')+xs(i).toFixed(1)+','+ays(v).toFixed(1)).join('');
      h+=`<path d="${lp}" fill="none" stroke="${LCOL}" stroke-width="2"/>`;
      h+=`<path d="${ap}" fill="none" stroke="${ACOL}" stroke-width="2" stroke-dasharray="4,2"/>`;
      // Legend
      h+=`<circle cx="${M.l+8}" cy="${M.t-8}" r="3" fill="${LCOL}"/><text x="${M.l+16}" y="${M.t-3}" fill="#94a3b8" font-size="9">Loss</text>`;
      h+=`<circle cx="${M.l+54}" cy="${M.t-8}" r="3" fill="${ACOL}"/><text x="${M.l+62}" y="${M.t-3}" fill="#94a3b8" font-size="9">Acc</text>`;
      h+='</svg>';
    });
  }
  h += '</div>'; // end right

  h += '</div>'; // end cols
  return h;
}

(async () => {
  try {
    const [rg, re, rm] = await Promise.all([
      fetch('/api/model_log/gat').then(r=>r.ok?r.json():null),
      fetch('/api/model_log/ensemble').then(r=>r.ok?r.json():null),
      fetch('/api/model_log/mlp').then(r=>r.ok?r.json():null)
    ]);
    document.getElementById('root').innerHTML = render(rg, re, rm);
  } catch {
    document.getElementById('root').innerHTML = '<div class="nodata">Failed to load.</div>';
  }
})();
</script></body></html>
