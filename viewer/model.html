<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><title>Model</title>
<link rel="stylesheet" href="/theme.css"><style>
body { overflow-y: auto; }
.dash { max-width: 1500px; margin: 52px auto 48px; padding: 0 24px; }
h2 { font-size: 18px; color: var(--accent); margin: 0 0 8px; }
h3 { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin: 16px 0 6px; }
.kpi { display: flex; gap: 10px; flex-wrap: wrap; margin: 8px 0; }
.kpi>div { background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 7px; padding: 10px 14px; text-align: center; min-width: 60px; }
.kpi .n { font-size: 22px; font-weight: 700; font-family: var(--font-mono); color: var(--accent); }
.kpi .n.g { color: #22c55e; }
.kpi .n.o { color: #f59e0b; }
.kpi .l { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 16px; }
table { width: 100%; border-collapse: collapse; font-size: 11px; margin: 6px 0; }
td { padding: 4px 8px; border-bottom: 1px solid var(--bg-tertiary); font-family: var(--font-mono); }
td:first-child { color: var(--text-secondary); font-family: inherit; width: 90px; }
td+td { color: var(--text-primary); }
.nodata { color: var(--text-muted); padding: 60px; text-align: center; }
.seed-tag { display:inline-block;padding:2px 6px;border-radius:3px;font-size:10px;font-family:var(--font-mono);color:var(--accent);background:var(--bg-tertiary);border:1px solid var(--border);margin-right:4px}
</style></head><body>
<div id="navbar">
  <a href="/">Compare</a><a href="/labels">Labels</a>
  <a href="/model" class="active">Model</a><a href="/infer">Infer</a>
</div>
<div class="dash" id="root"><div class="nodata">Loading...</div></div>
<script>
function renderSVGCurves(histories, labels, opts={}) {
  // histories: [{name, loss, val_loss, acc, color}]
  // Dual-Y: left=loss, right=acc
  const W=600, H=opts.h||160, LCOL='#f97316', VCOL='#ef4444', ACOL='#22c55e';
  const M={t:16,r:opts.accLabel?50:46,b:22,l:46}, pw=W-M.l-M.r, ph=H-M.t-M.b;

  let lmin=Infinity,lmax=-Infinity,amax=-Infinity,amin=Infinity,nMax=0;
  histories.forEach(h=>{
    (h.loss||[]).forEach(v=>{if(v<lmin)lmin=v;if(v>lmax)lmax=v;});
    (h.val_loss||[]).forEach(v=>{if(v<lmin)lmin=v;if(v>lmax)lmax=v;});
    (h.acc||[]).forEach(v=>{if(v<amin)amin=v;if(v>amax)amax=v;});
    nMax=Math.max(nMax,(h.loss||[]).length);
  });
  if(!isFinite(lmin)) return '';
  lmax*=1.05;lmin*=0.95;amax=Math.ceil(amax*20)/20;amin=Math.max(0,amin-0.02);
  const lr=lmax-lmin||1, ar=amax-amin||1;
  const lys=v=>M.t+ph*(1-(v-lmin)/lr);
  const ays=v=>M.t+ph*(1-(v-amin)/ar);
  const xs=i=>M.l+(pw/Math.max(nMax-1,1))*i;

  let h='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;background:var(--bg-tertiary);border-radius:4px">';
  for(let i=0;i<=4;i++){const y=M.t+ph*i/4;h+=`<line x1="${M.l}" y1="${y}" x2="${W-M.r}" y2="${y}" stroke="var(--bg-secondary)" stroke-width="0.5"/>`;}
  for(let i=0;i<=4;i++){const y=M.t+ph*i/4;h+=`<text x="${M.l-4}" y="${y+4}" fill="${LCOL}" font-size="9" text-anchor="end">${(lmax-(lmax-lmin)*i/4).toFixed(2)}</text>`;}
  if(opts.accLabel) for(let i=0;i<=4;i++){const y=M.t+ph*i/4;h+=`<text x="${W-M.r+4}" y="${y+4}" fill="${ACOL}" font-size="9">${((amin+ar*i/4)*100).toFixed(0)}%</text>`;}
  for(let i=0;i<nMax;i+=Math.max(1,Math.floor(nMax/5)))h+=`<text x="${xs(i)}" y="${H-4}" fill="#64748b" font-size="8" text-anchor="middle">${i+1}</text>`;

  histories.forEach((dh,si)=>{
    const loss=dh.loss||[], vloss=dh.val_loss||[], acc=dh.acc||[], n=loss.length;
    if(n<2) return;
    const c=dh.color||['#f97316','#ef4444','#22c55e','#8b5cf6','#f59e0b'][si%5];
    if(loss.length) h+=`<path d="${loss.map((v,i)=>(i===0?'M':'L')+xs(i).toFixed(1)+','+lys(v).toFixed(1)).join('')}" fill="none" stroke="${c}" stroke-width="1.2" opacity="0.5"/>`;
    if(vloss.length) h+=`<path d="${vloss.map((v,i)=>(i===0?'M':'L')+xs(i).toFixed(1)+','+lys(v).toFixed(1)).join('')}" fill="none" stroke="${c}" stroke-width="1.2" stroke-dasharray="4,2" opacity="0.9"/>`;
    if(acc.length) h+=`<path d="${acc.map((v,i)=>(i===0?'M':'L')+xs(i).toFixed(1)+','+ays(v).toFixed(1)).join('')}" fill="none" stroke="${c}" stroke-width="2" opacity="0.85"/>`;
  });

  // legend
  let lx=M.l+8;
  h+=`<circle cx="${lx}" cy="${M.t-8}" r="3" fill="${LCOL}" opacity="0.5"/><text x="${lx+8}" y="${M.t-3}" fill="#94a3b8" font-size="9">Train Loss</text>`;
  lx+=80;
  h+=`<circle cx="${lx}" cy="${M.t-8}" r="3" fill="${VCOL}" opacity="0.9"/><text x="${lx+8}" y="${M.t-3}" fill="#94a3b8" font-size="9">Val Loss</text>`;
  lx+=80;
  if(opts.accLabel){h+=`<circle cx="${lx}" cy="${M.t-8}" r="3" fill="${ACOL}" opacity="0.85"/><text x="${lx+8}" y="${M.t-3}" fill="#94a3b8" font-size="9">Val Acc</text>`;lx+=80;}
  if(labels) labels.forEach((lb,i)=>{const c=histories[i]?.color||'#888';h+=`<rect x="${lx}" y="${M.t-10}" width="8" height="8" rx="2" fill="${c}"/><text x="${lx+12}" y="${M.t-2}" fill="#94a3b8" font-size="9">${lb}</text>`;lx+=lb.length*8+24;});
  h+='</svg>';
  return h;
}

function render(gat, ens, mlp) {
  if (!gat && !mlp) return '<div class="nodata">No training data.</div>';
  var S='#64748b';
  var isEnsemble = gat && gat.type === '5ensemble';
  var nModels = isEnsemble ? (gat.seeds||[]).length : 0;

  var h = '';

  // ── Pipeline ──
  h += '<div style="text-align:center;margin-bottom:24px">';
  h += '<svg viewBox="0 0 920 100" style="width:100%;max-width:920px"><defs><marker id="a" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,1 L5,2.5 L0,4 Z" fill="'+S+'"/></marker></defs>';
  // STL
  h += '<rect x="5" y="25" width="100" height="46" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>';
  h += '<text x="55" y="44" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">STL Mesh</text>';
  h += '<text x="55" y="60" text-anchor="middle" fill="'+S+'" font-size="10">triangles</text>';
  h += '<line x1="105" y1="48" x2="148" y2="48" stroke="'+S+'" stroke-width="1.5" marker-end="url(#a)"/>';
  // GAT
  var accLabel = isEnsemble && ens ? (ens.test_acc*100).toFixed(1)+'%' : '88.1%';
  h += '<rect x="153" y="6" width="210" height="80" rx="6" fill="#0c1929" stroke="#06b6d4" stroke-width="1.5"/>';
  h += '<text x="258" y="26" text-anchor="middle" fill="#06b6d4" font-size="13" font-weight="700">GAT Classifier</text>';
  h += '<text x="258" y="42" text-anchor="middle" fill="#94a3b8" font-size="10">3-layer + JK, 192h x4 heads</text>';
  h += '<text x="258" y="56" text-anchor="middle" fill="#94a3b8" font-size="10">26-dim feat, 919K params</text>';
  h += '<text x="258" y="72" text-anchor="middle" fill="#06b6d4" font-size="10">'+nModels+'-way ensemble '+accLabel+'</text>';
  h += '<line x1="363" y1="48" x2="406" y2="48" stroke="'+S+'" stroke-width="1.5" marker-end="url(#a)"/>';
  // MLP
  h += '<rect x="410" y="15" width="160" height="62" rx="6" fill="#0c1929" stroke="#f59e0b" stroke-width="1.5"/>';
  h += '<text x="490" y="34" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="700">MLP Edge</text>';
  h += '<text x="490" y="50" text-anchor="middle" fill="#94a3b8" font-size="10">4-64-32-16-1</text>';
  h += '<text x="490" y="64" text-anchor="middle" fill="#f59e0b" font-size="10">99.3% test, 2.9K</text>';
  h += '<line x1="570" y1="48" x2="613" y2="48" stroke="'+S+'" stroke-width="1.5" marker-end="url(#a)"/>';
  // Merge
  h += '<rect x="618" y="22" width="100" height="46" rx="6" fill="#0c1929" stroke="#22c55e" stroke-width="1.5"/>';
  h += '<text x="668" y="40" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="700">CC + Vote</text>';
  h += '<text x="668" y="56" text-anchor="middle" fill="#22c55e" font-size="10">area-weighted</text>';
  h += '<line x1="718" y1="48" x2="768" y2="48" stroke="'+S+'" stroke-width="1.5" marker-end="url(#a)"/>';
  // Output
  h += '<text x="800" y="30" text-anchor="middle" fill="#8b5cf6" font-size="11" font-weight="700">6-class</text>';
  h += '<text x="800" y="48" text-anchor="middle" fill="#8b5cf6" font-size="11" font-weight="700">per-face</text>';
  h += '<text x="800" y="66" text-anchor="middle" fill="'+S+'" font-size="10">output</text>';
  h += '</svg></div>';

  // ── TWO COLUMNS ──
  h += '<div class="cols">';

  // ===== LEFT: GAT =====
  h += '<div class="card" style="padding:16px"><h2>GAT Classifier</h2>';
  h += '<div class="kpi">';
  if (ens && ens.test_acc != null) h += '<div><div class="n g">'+(ens.test_acc*100).toFixed(1)+'%</div><div class="l">Ensemble Test</div></div>';
  if (gat && gat.results) {
    var bests = gat.results.map(function(r){return r.best_val;});
    var avgVal = bests.reduce(function(a,b){return a+b;},0)/bests.length;
    var maxVal = Math.max.apply(null,bests);
    h += '<div><div class="n g">'+(maxVal*100).toFixed(1)+'%</div><div class="l">Best Val</div></div>';
    h += '<div><div class="n">'+(avgVal*100).toFixed(1)+'%</div><div class="l">Avg Val</div></div>';
  }
  h += '<div><div class="n">919K</div><div class="l">Params</div></div>';
  if (gat && gat.total_time_s) h += '<div><div class="n o">'+Math.round(gat.total_time_s/60)+'m</div><div class="l">Time</div></div>';
  h += '</div>';

  h += '<h3>Config</h3><table>';
  h += '<tr><td>Architecture</td><td>3 GATConv + JK, 192h x4 heads</td></tr>';
  h += '<tr><td>Input</td><td>26-dim: normals(3)+Fourier(12)+geom(8)+edge(3)</td></tr>';
  h += '<tr><td>Loss</td><td>Focal Loss (gamma=2) + class-balanced weights</td></tr>';
  h += '<tr><td>Optimizer</td><td>AdamW lr=0.002, warmup 25ep + Cosine LR</td></tr>';
  h += '<tr><td>Regularization</td><td>DropEdge 15%, Dropout 0.3, SWA, AMP</td></tr>';
  h += '<tr><td>Data</td><td>'+(gat?gat.n_train:'?')+' train / '+(gat?gat.n_val:'?')+' val / '+(gat?gat.n_test:'?')+' test</td></tr>';
  h += '</table>';

  // GAT Training Curve
  h += '<h3>Training Curve</h3>';
  if (isEnsemble && gat.histories) {
    // 5 ensemble: combine all models, show sub-label per seed
    var curveData = [];
    var seedColors = {'42':'#f97316','123':'#ef4444','456':'#22c55e','789':'#8b5cf6','1024':'#f59e0b'};
    var seedLabels = [];
    for (var s in gat.histories) {
      var hist = gat.histories[s];
      var result = (gat.results||[]).find(function(r){return String(r.seed)===s;});
      curveData.push({name:'S'+s, loss:hist.loss, val_loss:hist.val_loss, acc:hist.acc, color:seedColors[s]||'#888'});
      seedLabels.push('S'+s+' '+(result?(result.best_val*100).toFixed(1)+'%':''));
    }
    h += renderSVGCurves(curveData, seedLabels, {accLabel:true,h:160});
  } else if (gat && gat.fold_histories) {
    // Old CV format
    var cvData = gat.fold_histories.map(function(fh, i){
      return {name:'Fold '+fh.fold, loss:fh.loss, val_loss:fh.val_loss, acc:fh.acc, color:['#f97316','#ef4444','#22c55e'][i]};
    });
    h += renderSVGCurves(cvData, null, {accLabel:true,h:160});
  } else {
    h += '<div style="color:var(--text-muted);font-size:11px;padding:12px;text-align:center;background:var(--bg-tertiary);border-radius:6px">No curve data.</div>';
  }

  // Seed summary cards
  if (isEnsemble && gat.results) {
    h += '<h3>Model Seeds</h3>';
    gat.results.forEach(function(r){
      h += '<span class="seed-tag">S'+r.seed+': '+(r.best_val*100).toFixed(1)+'% ('+r.epochs+'ep)</span>';
    });
  }

  // Per-Class (from ensemble report)
  if (ens && ens.per_class) {
    h += '<h3>Per-Class Accuracy</h3>';
    Object.entries(ens.per_class).forEach(function(e){
      var n=e[0], i=e[1];
      var p=(i.acc*100).toFixed(1);
      var cl={'plane':'#4db8ff','cylinder':'#44cc44','sphere':'#ff44ff','cone':'#ff8844','torus':'#ffcc00','freeform':'#888888'}[n]||'#ccc';
      h += '<div style="display:flex;align-items:center;gap:8px;margin:4px 0"><span style="width:64px;font-size:11px;font-family:var(--font-mono);color:'+cl+'">'+n+'</span><span style="flex:1"><div style="height:7px;border-radius:4px;background:var(--bg-secondary);overflow:hidden"><div style="height:100%;border-radius:4px;width:'+Math.max(2,i.acc*100)+'%;background:'+cl+'"></div></div></span><span style="width:48px;text-align:right;font-size:11px;font-family:var(--font-mono);color:'+cl+'">'+p+'%</span></div>';
    });
  }
  h += '</div>'; // end left GAT

  // ===== RIGHT: MLP =====
  h += '<div class="card" style="padding:16px"><h2>MLP Edge Classifier</h2>';
  h += '<div class="kpi">';
  h += '<div><div class="n g">'+(mlp&&mlp.best_acc!=null?(mlp.best_acc*100).toFixed(1)+'%':'99.3%')+'</div><div class="l">Accuracy</div></div>';
  h += '<div><div class="n">'+(mlp&&mlp.params?(mlp.params/1000).toFixed(1)+'K':'2.9K')+'</div><div class="l">Params</div></div>';
  h += '<div><div class="n o">'+(mlp&&mlp.total_time_s?Math.round(mlp.total_time_s/60)+'m':'47s')+'</div><div class="l">Time</div></div>';
  h += '</div>';

  h += '<h3>Config</h3><table>';
  h += '<tr><td>Architecture</td><td>4-64-32-16-1, Dropout 0.1</td></tr>';
  h += '<tr><td>Input</td><td>4-dim: angle, area ratio, dist, convexity</td></tr>';
  h += '<tr><td>Output</td><td>Binary: same face (1) or boundary (0)</td></tr>';
  h += '<tr><td>Optimizer</td><td>Adam lr=0.001, BS=8192, 50 epochs</td></tr>';
  h += '<tr><td>Training data</td><td>3.8M edge pairs from 16K STEP files</td></tr>';
  h += '</table>';

  // MLP curves
  if (mlp && mlp.histories && mlp.histories.length > 0) {
    h += '<h3>Training Curve</h3>';
    var mlpCurves = mlp.histories.map(function(mh, si){
      return {
        name: 'M'+(si+1)+' (S'+mh.seed+')',
        loss: mh.history.loss,
        val_loss: mh.history.val_loss||[],
        acc: mh.history.acc,
        color: ['#f97316','#ef4444','#22c55e'][si]
      };
    });
    h += renderSVGCurves(mlpCurves, null, {accLabel:true,h:140});
  }
  h += '</div>'; // end right MLP

  h += '</div>'; // end cols
  return h;
}

(async () => {
  try {
    var results = await Promise.all([
      fetch('/api/model_log/gat').then(function(r){return r.ok?r.json():null;}),
      fetch('/api/model_log/ensemble').then(function(r){return r.ok?r.json():null;}),
      fetch('/api/model_log/mlp').then(function(r){return r.ok?r.json():null;})
    ]);
    document.getElementById('root').innerHTML = render(results[0], results[1], results[2]);
  } catch(e) {
    document.getElementById('root').innerHTML = '<div class="nodata">Failed to load: '+e.message+'</div>';
  }
})();
</script></body></html>
