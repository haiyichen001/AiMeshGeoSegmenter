<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><title>Model</title>
<link rel="stylesheet" href="/theme.css"><style>
body { overflow-y: auto; }
.dash { max-width: 1500px; margin: 52px auto 48px; padding: 0 28px; display: flex; flex-direction: column; gap: 22px; }
h2 { font-size: 20px; margin: 0 0 4px; color: var(--accent); }
h3 { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.2px; margin: 20px 0 8px; }
.row2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 22px; }
.kpi { display: flex; gap: 10px; flex-wrap: wrap; }
.kpi>div { background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 8px; padding: 14px 18px; text-align: center; min-width: 80px; }
.kpi .n { font-size: 26px; font-weight: 700; font-family: var(--font-mono); color: var(--accent); }
.kpi .n.g { color: #22c55e; }
.kpi .lab { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 3px; }
.bar { height: 7px; border-radius: 4px; background: var(--bg-secondary); overflow: hidden; margin: 2px 0; }
.bar-fill { height: 100%; border-radius: 4px; }
.cr { display: flex; align-items: center; gap: 10px; margin: 5px 0; }
.cr .nm { width: 70px; font-size: 12px; font-family: var(--font-mono); }
.cr .bw { flex:1; }
.cr .pv { width: 52px; text-align: right; font-size: 12px; font-family: var(--font-mono); }
.fg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.fc { background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 8px; padding: 12px 10px; text-align: center; }
.fc .sd { font-size: 9px; color: var(--text-muted); margin-bottom: 4px; }
.fc .fv { font-size: 16px; font-weight: 700; font-family: var(--font-mono); }
.fc .fl { font-size: 10px; color: var(--text-secondary); }
.nodata { color: var(--text-muted); padding: 60px; text-align: center; }
table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 8px 0; }
th { text-align: left; color: var(--text-muted); font-weight: 500; padding: 6px 10px; border-bottom: 1px solid var(--border); }
td { padding: 6px 10px; color: var(--text-primary); border-bottom: 1px solid var(--bg-tertiary); font-family: var(--font-mono); }
td:first-child { color: var(--text-secondary); font-family: inherit; }
</style></head><body>
<div id="navbar">
  <a href="/">Compare</a><a href="/labels">Labels</a>
  <a href="/model" class="active">Model</a><a href="/infer">Infer</a>
</div>
<div class="dash" id="root"><div class="nodata">Loading...</div></div>
<script>
const C = ['#06b6d4','#f59e0b','#22c55e','#ef4444','#8b5cf6','#ec4899'];
const TM = getComputedStyle(document.documentElement).getPropertyValue('--text-muted')?.trim()||'#666';

function render(gat, ens) {
  if (!gat && !ens) return '<div class="nodata">No training data.</div>';
  let h = '';

  // === TOP METRICS ===
  h += '<div class="kpi">';
  if (ens && ens.test_acc != null) h += `<div><div class="n g">${(ens.test_acc*100).toFixed(1)}%</div><div class="lab">Test Acc (ensemble)</div></div>`;
  if (gat && gat.mean != null) h += `<div><div class="n">${(gat.mean*100).toFixed(1)}%</div><div class="lab">CV Mean</div></div>`;
  if (gat && gat.k) h += `<div><div class="n">${gat.k}-fold</div><div class="lab">Cross Val</div></div>`;
  if (gat && gat.params) h += `<div><div class="n">${(gat.params/1000).toFixed(0)}K</div><div class="lab">Params</div></div>`;
  if (ens && ens.train_time_s) h += `<div><div class="n">${Math.round(ens.train_time_s/60)}min</div><div class="lab">Train Time</div></div>`;
  h += '</div>';

  // === TWO COLUMNS ===
  h += '<div class="row2">';

  // LEFT: Pipeline SVG + Architecture table
  h += '<div>';

  // Neural network diagram
  h += '<h3>Architecture</h3>';
  h += `<svg viewBox="0 0 620 340" style="width:100%;background:#0f172a;border-radius:10px;border:1px solid #1e293b">
    <defs>
      <marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,1 L6,3 L0,5 Z" fill="#475569"/></marker>
    </defs>
    <!-- GAT input layer -->
    <rect x="8" y="20" width="52" height="80" rx="3" fill="none" stroke="#06b6d4" stroke-width="1" opacity=".4"/>
    <text x="34" y="108" text-anchor="middle" fill="#64748b" font-size="9">26-dim</text>
    <circle cx="34" cy="40" r="3" fill="#06b6d4" opacity=".5"/><circle cx="34" cy="52" r="3" fill="#06b6d4" opacity=".5"/>
    <circle cx="34" cy="64" r="3" fill="#06b6d4" opacity=".5"/><circle cx="34" cy="76" r="3" fill="#06b6d4" opacity=".5"/>
    <circle cx="34" cy="88" r="3" fill="#06b6d4" opacity=".5"/>

    <!-- GAT Layer 1 -->
    <line x1="60" y1="60" x2="100" y2="60" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="104" y="12" width="60" height="96" rx="4" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="134" y="116" text-anchor="middle" fill="#64748b" font-size="9">GAT 1</text>
    <text x="134" y="126" text-anchor="middle" fill="#64748b" font-size="8">192h x4</text>
    <circle cx="134" cy="30" r="2.5" fill="#06b6d4" opacity=".6"/>
    <circle cx="122" cy="42" r="2.5" fill="#06b6d4" opacity=".6"/><circle cx="146" cy="42" r="2.5" fill="#06b6d4" opacity=".6"/>
    <circle cx="122" cy="56" r="2.5" fill="#06b6d4" opacity=".6"/><circle cx="146" cy="56" r="2.5" fill="#06b6d4" opacity=".6"/>
    <circle cx="134" cy="70" r="2.5" fill="#06b6d4" opacity=".6"/>
    <circle cx="122" cy="82" r="2.5" fill="#06b6d4" opacity=".6"/><circle cx="146" cy="82" r="2.5" fill="#06b6d4" opacity=".6"/>
    <circle cx="134" cy="96" r="2.5" fill="#06b6d4" opacity=".6"/>

    <!-- GAT Layer 2 -->
    <line x1="164" y1="60" x2="204" y2="60" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="208" y="12" width="60" height="96" rx="4" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="238" y="116" text-anchor="middle" fill="#64748b" font-size="9">GAT 2</text>
    <text x="238" y="126" text-anchor="middle" fill="#64748b" font-size="8">192h x4</text>
    <circle cx="238" cy="30" r="2.5" fill="#06b6d4" opacity=".6"/>
    <circle cx="226" cy="42" r="2.5" fill="#06b6d4" opacity=".6"/><circle cx="250" cy="42" r="2.5" fill="#06b6d4" opacity=".6"/>
    <circle cx="226" cy="56" r="2.5" fill="#06b6d4" opacity=".6"/><circle cx="250" cy="56" r="2.5" fill="#06b6d4" opacity=".6"/>
    <circle cx="238" cy="70" r="2.5" fill="#06b6d4" opacity=".6"/>
    <circle cx="226" cy="82" r="2.5" fill="#06b6d4" opacity=".6"/><circle cx="250" cy="82" r="2.5" fill="#06b6d4" opacity=".6"/>
    <circle cx="238" cy="96" r="2.5" fill="#06b6d4" opacity=".6"/>

    <!-- GAT Layer 3 -->
    <line x1="268" y1="60" x2="308" y2="60" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="312" y="18" width="50" height="84" rx="4" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="337" y="110" text-anchor="middle" fill="#64748b" font-size="9">GAT 3</text>
    <text x="337" y="120" text-anchor="middle" fill="#64748b" font-size="8">96h x1</text>
    <circle cx="337" cy="34" r="2.5" fill="#06b6d4" opacity=".6"/>
    <circle cx="337" cy="48" r="2.5" fill="#06b6d4" opacity=".6"/>
    <circle cx="337" cy="62" r="2.5" fill="#06b6d4" opacity=".6"/>
    <circle cx="337" cy="76" r="2.5" fill="#06b6d4" opacity=".6"/>
    <circle cx="337" cy="90" r="2.5" fill="#06b6d4" opacity=".6"/>

    <!-- JK concatenation -->
    <text x="440" y="36" fill="#22c55e" font-size="10" font-weight="600">Jumping Knowledge</text>
    <path d="M 100 12 Q 300 -20 362 18" fill="none" stroke="#22c55e" stroke-width="1" stroke-dasharray="3" opacity=".4"/>
    <path d="M 204 12 Q 300 -20 362 18" fill="none" stroke="#22c55e" stroke-width="1" stroke-dasharray="3" opacity=".4"/>
    <path d="M 362 18 Q 400 -10 430 8" fill="none" stroke="#22c55e" stroke-width="1" marker-end="url(#a)"/>

    <!-- MLP output head -->
    <rect x="440" y="50" width="80" height="40" rx="6" fill="#0c1929" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="480" y="66" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">MLP Head</text>
    <text x="480" y="80" text-anchor="middle" fill="#64748b" font-size="9">6-class</text>

    <!-- ===== EDGE MLP (bottom) ===== -->
    <rect x="8" y="190" width="160" height="38" rx="6" fill="#0c1929" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="88" y="206" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="600">MLP Edge Classifier</text>
    <text x="88" y="220" text-anchor="middle" fill="#64748b" font-size="9">4-dim → 32 → 16 → 1</text>

    <!-- CC + Vote -->
    <line x1="168" y1="209" x2="220" y2="209" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="224" y="190" width="120" height="38" rx="6" fill="#0c1929" stroke="#22c55e" stroke-width="1.5"/>
    <text x="284" y="206" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="600">CC + Vote</text>
    <text x="284" y="220" text-anchor="middle" fill="#64748b" font-size="9">majority label</text>

    <!-- Output -->
    <line x1="344" y1="209" x2="396" y2="209" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="408" y="214" fill="#e2e8f0" font-size="12" font-weight="600">6-class per-face</text>

    <!-- Labels row -->
    <rect x="260" y="270" width="64" height="18" rx="3" fill="#4db8ff" opacity=".85"/><text x="292" y="283" text-anchor="middle" fill="#000" font-size="10" font-weight="700">plane</text>
    <rect x="330" y="270" width="74" height="18" rx="3" fill="#44cc44" opacity=".85"/><text x="367" y="283" text-anchor="middle" fill="#000" font-size="10" font-weight="700">cylinder</text>
    <rect x="410" y="270" width="64" height="18" rx="3" fill="#ff44ff" opacity=".85"/><text x="442" y="283" text-anchor="middle" fill="#000" font-size="10" font-weight="700">sphere</text>
    <rect x="480" y="270" width="56" height="18" rx="3" fill="#ff8844" opacity=".85"/><text x="508" y="283" text-anchor="middle" fill="#000" font-size="10" font-weight="700">cone</text>
    <rect x="260" y="296" width="56" height="18" rx="3" fill="#ffcc00" opacity=".85"/><text x="288" y="309" text-anchor="middle" fill="#000" font-size="10" font-weight="700">torus</text>
    <rect x="322" y="296" width="80" height="18" rx="3" fill="#888888" opacity=".85"/><text x="362" y="309" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">freeform</text>

    <!-- Detail tables -->
    <text x="8" y="328" fill="#64748b" font-size="9">GAT: 3-layer + JK, 192h x4 heads, 26-dim in, 3-dim edge feat</text>
    <text x="8" y="338" fill="#64748b" font-size="9">MLP: 4→32→16→1, 4-dim edge feat, 95.2% acc, 705 params</text>
  </svg>`;

  // Architecture details table
  h += '<h3>Training Config</h3><table>';
  h += '<tr><td>Loss</td><td>Focal Loss (γ=2.0) with class-balanced weights</td></tr>';
  h += '<tr><td>Optimizer</td><td>AdamW, lr=0.002, weight_decay=1e-4</td></tr>';
  h += '<tr><td>Schedule</td><td>Warmup 25 ep + Cosine Annealing</td></tr>';
  h += '<tr><td>Regularization</td><td>DropEdge 15%, Dropout 0.3, SWA</td></tr>';
  h += '<tr><td>Precision</td><td>AMP mixed precision (float16)</td></tr>';
  h += '<tr><td>Batch</td><td>108 graphs, GPU-direct (zero CPU transfer)</td></tr>';
  h += '<tr><td>Data</td><td>13,931 train / 2,985 val / 2,986 test (70/15/15)</td></tr>';
  h += '</table>';
  h += '</div>'; // end left

  // RIGHT: Per-class + Folds
  h += '<div>';
  h += '<h3>Per-Class Accuracy</h3>';
  if (ens && ens.per_class) {
    Object.entries(ens.per_class).forEach(([name, info]) => {
      const pct = (info.acc*100).toFixed(1);
      const color = {'plane':'#4db8ff','cylinder':'#44cc44','sphere':'#ff44ff','cone':'#ff8844','torus':'#ffcc00','freeform':'#888888'}[name]||'#ccc';
      h += `<div class="cr"><span class="nm" style="color:${color}">${name}</span><span class="bw">${bar(info.acc, 1, color)}</span><span class="pv" style="color:${color}">${pct}%</span></div>`;
    });
  }

  h += '<h3>Fold Results (3 seeds x3 folds)</h3>';
  if (ens && ens.fold_results) {
    const seeds = [...new Set(ens.fold_results.map(f=>f.seed))].sort();
    seeds.forEach(seed => {
      const folds = ens.fold_results.filter(f=>f.seed===seed);
      const avg = folds.reduce((s,f)=>s+f.best_val,0)/folds.length;
      h += `<div style="margin-bottom:16px"><div style="font-size:10px;color:${TM};margin-bottom:6px">Seed ${seed} — avg ${(avg*100).toFixed(1)}%</div>`;
      h += '<div class="fg">';
      folds.forEach(f=>{
        h += `<div class="fc"><div class="sd">Fold ${f.fold}</div><div class="fv" style="color:${C[f.fold%6]}">${(f.best_val*100).toFixed(1)}%</div></div>`;
      });
      h += '</div></div>';
    });
  }
  h += '</div>'; // end right
  h += '</div>'; // end row2

  function bar(v, max, color) {
    const pct = Math.max(2, (v/max)*100);
    return `<div class="bar"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>`;
  }

  return '<div class="card" style="padding:22px">'+h+'</div>';
}

(async () => {
  try {
    const [r1, r2] = await Promise.all([
      fetch('/api/model_log/gat').then(r=>r.ok?r.json():null),
      fetch('/api/model_log/ensemble').then(r=>r.ok?r.json():null)
    ]);
    document.getElementById('root').innerHTML = render(r1, r2);
  } catch {
    document.getElementById('root').innerHTML = '<div class="nodata">Failed to load.</div>';
  }
})();
</script></body></html>
