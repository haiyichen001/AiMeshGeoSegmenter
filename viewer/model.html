<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><title>Model</title>
<link rel="stylesheet" href="/theme.css"><style>
body { overflow-y: auto; }
.dashboard { max-width: 1100px; margin: 56px auto 40px; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
.row { display: flex; gap: 20px; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 280px; }
.metrics { display: flex; gap: 20px; flex-wrap: wrap; }
.metric { padding: 12px 20px; background: var(--bg-tertiary); border-radius: var(--radius); text-align: center; min-width: 80px; }
.metric .val { font-size: 22px; font-weight: 700; color: var(--accent); font-family: var(--font-mono); }
.metric .label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.chart-container { position: relative; width: 100%; }
.chart-container svg { width: 100%; }
.legend { display: flex; gap: 16px; font-size: 11px; color: var(--text-secondary); margin: 4px 0 8px; }
.legend span { display: flex; align-items: center; gap: 4px; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.nodata { color: var(--text-muted); font-size: 14px; padding: 40px; text-align: center; }
</style></head><body>
<div id="navbar">
  <a href="/">Compare</a><a href="/labels">Labels</a>
  <a href="/model" class="active">Model</a><a href="/infer">Infer</a>
</div>
<div class="dashboard" id="root"><div class="nodata">Loading training data...</div></div>
<script>
const COLORS = ['#06b6d4','#f59e0b','#22c55e','#ef4444','#8b5cf6','#ec4899'];
const DARK = getComputedStyle(document.documentElement).getPropertyValue('--bg-secondary').trim() || '#121212';
const GRID = getComputedStyle(document.documentElement).getPropertyValue('--bg-tertiary').trim() || '#1e1e1e';
const TEXT = getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim() || '#666';

function lineChart(data, opts = {}) {
  // data: [{label, values, color}] — values are arrays
  if (!data || !data.length || !data[0].values.length) return '';
  const W = opts.w || 1000; const H = opts.h || 200;
  const M = {t:20, r:60, b:40, l:60}; // margins
  const pw = W - M.l - M.r; const ph = H - M.t - M.b;
  const n = data[0].values.length;

  let ymin = Infinity, ymax = -Infinity;
  data.forEach(d => d.values.forEach(v => { if (v < ymin) ymin = v; if (v > ymax) ymax = v; }));
  const yr = ymax - ymin || 1;
  ymin -= yr * 0.05; ymax += yr * 0.05;
  const ysc = v => M.t + ph * (1 - (v - ymin) / (ymax - ymin));
  const xsc = i => M.l + (pw / Math.max(n-1, 1)) * i;

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  // Grid
  for (let i = 0; i <= 4; i++) {
    const y = M.t + ph * i / 4;
    svg += `<line x1="${M.l}" y1="${y}" x2="${W-M.r}" y2="${y}" stroke="${GRID}" stroke-width="0.5"/>`;
    const val = ymax - (ymax-ymin) * i / 4;
    svg += `<text x="${M.l-6}" y="${y+4}" fill="${TEXT}" font-size="10" text-anchor="end">${val.toFixed(3)}</text>`;
  }
  // X labels
  for (let i = 0; i < n; i += Math.max(1, Math.floor(n/10))) {
    const x = xsc(i);
    svg += `<text x="${x}" y="${H-8}" fill="${TEXT}" font-size="9" text-anchor="middle">${i+1}</text>`;
  }
  // Lines
  data.forEach((d, di) => {
    const color = d.color || COLORS[di % COLORS.length];
    let path = '';
    d.values.forEach((v, i) => {
      path += (i === 0 ? 'M' : 'L') + `${xsc(i).toFixed(1)},${ysc(v).toFixed(1)} `;
    });
    svg += `<path d="${path}" fill="none" stroke="${color}" stroke-width="1.5" opacity="0.9"/>`;
    // Dots (sparse)
    const step = Math.max(1, Math.floor(n / 20));
    d.values.forEach((v, i) => {
      if (i % step === 0 || i === n-1) {
        svg += `<circle cx="${xsc(i).toFixed(1)}" cy="${ysc(v).toFixed(1)}" r="2" fill="${color}"/>`;
      }
    });
  });
  svg += '</svg>';
  return svg;
}

function render(log) {
  if (!log) return '<div class="nodata">No training data yet. Run train.py.</div>';

  const accs = log.fold_accuracies || [];
  const mean = log.mean || 0; const std = log.std || 0;
  const folds = log.fold_histories || [];

  let h = '<div class="card"><h2>'+log.model+'</h2>';
  // Metrics row
  h += '<div class="metrics">';
  h += `<div class="metric"><div class="val">${(mean*100).toFixed(2)}%</div><div class="label">Mean Acc</div></div>`;
  h += `<div class="metric"><div class="val">${(std*100).toFixed(2)}%</div><div class="label">Std</div></div>`;
  h += `<div class="metric"><div class="val">${log.k||'?'}</div><div class="label">Folds</div></div>`;
  h += `<div class="metric"><div class="val">${log.epochs||'?'}</div><div class="label">Epochs</div></div>`;
  h += `<div class="metric"><div class="val">${log.params||'?'}</div><div class="label">Params</div></div>`;
  if (log.batch_size) h += `<div class="metric"><div class="val">${log.batch_size}</div><div class="label">Batch</div></div>`;
  if (log.test_acc != null) h += `<div class="metric"><div class="val">${(log.test_acc*100).toFixed(2)}%</div><div class="label">Test Acc</div></div>`;
  h += '</div>';

  // Fold accuracy bars
  if (accs.length > 1) {
    const maxA = Math.max(...accs, 0.5);
    h += '<div style="margin-top:12px"><div style="font-size:12px;color:'+TEXT+';margin-bottom:4px">Fold Accuracies</div>';
    h += '<div style="display:flex;align-items:flex-end;gap:8px;height:80px;padding:4px 0">';
    accs.forEach((a,i) => {
      h += `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
        <div style="font-size:11px;color:'+TEXT+';font-family:var(--font-mono)">${(a*100).toFixed(1)}%</div>
        <div style="width:100%;max-width:50px;background:${COLORS[i]};border-radius:2px 2px 0 0;height:${Math.max(4,(a/maxA)*70)}px"></div>
        <div style="font-size:10px;color:'+TEXT+'">F${i+1}</div></div>`;
    });
    h += '</div></div>';
  }

  // Per-fold loss & accuracy line charts
  if (folds.length > 0) {
    h += '<div style="margin-top:16px">';
    folds.forEach((f, fi) => {
      const color = COLORS[fi % COLORS.length];
      h += `<div class="card" style="margin-bottom:16px;padding:14px"><strong style="font-size:14px;color:${color}">Fold ${f.fold}</strong>`;
      const ba = f.acc && f.acc.length ? Math.max(...f.acc) : 0;
      h += `<span style="font-size:12px;color:${TEXT};margin-left:8px">Best Acc: ${(ba*100).toFixed(2)}%</span>`;

      // Combined loss chart
      if (f.loss && f.loss.length > 1) {
        h += '<div style="margin:8px 0"><div style="font-size:11px;color:'+TEXT+';margin-bottom:2px">Training Curves</div>';
        // Compute ymax for combined chart
        const lossMax = Math.max(...f.loss);
        const lossMin = Math.min(...f.loss);
        const lossData = [{label: 'Train Loss', values: f.loss, color: '#f97316'}];
        if (f.val_loss && f.val_loss.length) {
          lossData.push({label: 'Val Loss', values: f.val_loss, color: '#ef4444'});
        }
        h += `<div class="legend">${lossData.map(d=>`<span><span class="legend-dot" style="background:${d.color}"></span>${d.label}</span>`).join('')}</div>`;
        h += lineChart(lossData, {w: 900, h: 180});
      }

      // Accuracy chart (separate scale)
      if (f.acc && f.acc.length > 1) {
        h += '<div style="margin:4px 0 0"><div style="font-size:11px;color:'+TEXT+';margin-bottom:2px">Validation Accuracy</div>';
        const accData = [{label: 'Val Acc', values: f.acc, color: '#06b6d4'}];
        h += lineChart(accData, {w: 900, h: 140});
      }
      h += '</div>';
    });
    h += '</div>';
  }

  // Final model training loss
  if (log.final && log.final.loss && log.final.loss.length > 1) {
    h += '<div class="card" style="padding:14px"><strong style="font-size:13px">Final Model (all data)</strong>';
    h += '<div style="font-size:11px;color:'+TEXT+';margin:4px 0">';
    const losses = log.final.loss;
    h += `Loss: ${losses[0].toFixed(3)} → ${losses[losses.length-1].toFixed(3)}`;
    h += '</div>';
    h += lineChart([{label: 'Train Loss', values: losses, color: '#f97316'}], {w: 900, h: 140});
    h += '</div>';
  }

  h += '</div>';
  return h;
}

(async () => {
  try { const r = await fetch('/api/model_log/gat');
    document.getElementById('root').innerHTML = render(r.ok ? await r.json() : null);
  } catch { document.getElementById('root').innerHTML = '<div class="nodata">Failed to load training data.</div>'; }
})();
</script></body></html>
