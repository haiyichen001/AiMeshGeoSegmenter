<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><title>Model</title>
<link rel="stylesheet" href="/theme.css"><style>
body { overflow-y: auto; }
.dashboard { max-width: 1000px; margin: 56px auto 40px; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
.row { display: flex; gap: 20px; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 280px; }
.bar-wrap { background: var(--bg-tertiary); border-radius: var(--radius-sm); height: 6px; margin: 4px 0 8px; overflow: hidden; }
.bar-fill { background: var(--accent); height: 100%; border-radius: var(--radius-sm); transition: width 0.3s; }
.chart-row { display: flex; align-items: flex-end; gap: 4px; height: 120px; padding: 8px 0; }
.chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.chart-bar { width: 100%; max-width: 60px; background: var(--accent); border-radius: var(--radius-sm) var(--radius-sm) 0 0; min-height: 2px; }
.chart-val { font-size: 11px; color: var(--text-secondary); font-family: var(--font-mono); }
.chart-label { font-size: 10px; color: var(--text-muted); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--text-muted); font-weight: 500; padding: 6px 12px; border-bottom: 1px solid var(--border); }
td { padding: 6px 12px; color: var(--text-primary); border-bottom: 1px solid var(--bg-tertiary); font-family: var(--font-mono); }
.tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.tag-ok { background: #064e3b; color: #22c55e; }
</style></head><body>
<div id="navbar">
  <a href="/">Compare</a><a href="/labels">Labels</a>
  <a href="/model" class="active">Model</a><a href="/infer">Infer</a>
</div>
<div class="dashboard" id="root"><div class="nodata">Loading training data...</div></div>
<script>
async function loadLog(url) {
  try { const r = await fetch(url); return r.ok ? await r.json() : null; }
  catch { return null; }
}
function barChart(accs, mean) {
  const max = Math.max(...accs, 0.5);
  return '<div class="chart-row">' + accs.map((a,i) => {
    const h = Math.max(4, (a/max)*110);
    return `<div class="chart-col"><div class="chart-val">${(a*100).toFixed(1)}%</div><div class="chart-bar" style="height:${h}px"></div><div class="chart-label">F${i+1}</div></div>`;
  }).join('') + '</div>';
}
function render(log) {
  if (!log) return '<div class="nodata">No training data yet. Run train.py.</div>';
  const accs = log.fold_accuracies || [];
  const mean = log.mean || 0; const std = log.std || 0; const k = log.k || 0;
  let h = '<div class="card"><h2>'+log.model+'</h2>';
  h += '<div class="metrics">';
  h += `<div class="metric"><div class="val">${(mean*100).toFixed(2)}%</div><div class="label">Mean Acc</div></div>`;
  h += `<div class="metric"><div class="val">${(std*100).toFixed(2)}%</div><div class="label">Std</div></div>`;
  h += `<div class="metric"><div class="val">${k}</div><div class="label">Folds</div></div>`;
  h += `<div class="metric"><div class="val">${log.epochs||'?'}</div><div class="label">Epochs</div></div>`;
  h += '</div>';
  if (accs.length > 1) h += barChart(accs, mean);
  // Final training loss curve (simple)
  if (log.final && log.final.loss) {
    h += '<div style="margin-top:12px"><strong style="font-size:12px;color:var(--text-muted)">Final Training Loss</strong>';
    const losses = log.final.loss;
    const lmax = Math.max(...losses);
    h += '<div class="bar-wrap" style="height:3px;margin-top:6px">';
    losses.forEach((l,i) => {
      h += `<span style="display:inline-block;width:${100/losses.length}%;height:3px;background:var(--accent);opacity:${0.3+l/lmax*0.7};float:left" title="Epoch ${i+1}: ${l.toFixed(3)}"></span>`;
    });
    h += '</div><div style="font-size:10px;color:var(--text-muted);margin-top:2px">Loss: '+losses[0].toFixed(2)+' -> '+losses[losses.length-1].toFixed(2)+'</div></div>';
  }
  // Fold history charts
  const folds = log.fold_histories || [];
  if (folds.length > 0) {
    h += '<div style="margin-top:16px">';
    folds.forEach(f => {
      h += `<div class="card" style="margin-bottom:12px;padding:12px"><strong style="font-size:13px;color:var(--accent)">Fold ${f.fold}</strong>`;
      const ba = f.acc && f.acc.length ? Math.max(...f.acc) : 0;
      h += `<span style="font-size:12px;color:var(--text-muted);margin-left:8px">Best Acc: ${(ba*100).toFixed(2)}%</span>`;
      // Loss curve
      if (f.loss && f.loss.length > 1) {
        const lmax = Math.max(...f.loss); const lmin = Math.min(...f.loss); const lr = lmax-lmin||1;
        h += '<div style="margin:8px 0"><span style="font-size:10px;color:var(--text-muted)">Loss</span>';
        h += '<div class="bar-wrap" style="height:4px;margin-top:2px">';
        f.loss.forEach((l,i) => {
          h += `<span style="display:inline-block;width:${100/f.loss.length}%;height:4px;background:#ff8844;opacity:${0.4+(l-lmin)/lr*0.6};float:left" title="E${i+1}: ${l.toFixed(3)}"></span>`;
        });
        h += '</div><span style="font-size:9px;color:var(--text-muted)">${f.loss[0].toFixed(2)} -> ${f.loss[f.loss.length-1].toFixed(2)}</span></div>';
      }
      // Acc curve
      if (f.acc && f.acc.length > 1) {
        const amax = Math.max(...f.acc); const amin = Math.min(...f.acc); const ar = amax-amin||1;
        h += '<div style="margin:4px 0"><span style="font-size:10px;color:var(--text-muted)">Acc</span>';
        h += '<div class="bar-wrap" style="height:4px;margin-top:2px">';
        f.acc.forEach((a,i) => {
          h += `<span style="display:inline-block;width:${100/f.acc.length}%;height:4px;background:#06b6d4;opacity:${0.4+(a-amin)/ar*0.6};float:left" title="E${i+1}: ${(a*100).toFixed(1)}%"></span>`;
        });
        h += '</div><span style="font-size:9px;color:var(--text-muted)">${(f.acc[0]*100).toFixed(0)}% -> ${(f.acc[f.acc.length-1]*100).toFixed(0)}%</span></div>';
      }
      h += '</div>';
    });
    h += '</div>';
  }
  h += '</div>';
  return h;
}
(async () => {
  const log = await loadLog('/api/model_log/gat');
  document.getElementById('root').innerHTML = render(log);
})();
</script></body></html>
