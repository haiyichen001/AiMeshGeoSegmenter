<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><title>AI Inference</title>
<link rel="stylesheet" href="/theme.css"><style>
body { overflow:hidden; margin:0; padding:0; }
#toolbar { position:fixed; top:38px; right:16px; z-index:100; display:flex; gap:8px; align-items:center; }
#toolbar select, #toolbar button { padding:6px 10px; background:#1a1a1a; color:#ccc; border:1px solid #444; border-radius:4px; font-size:12px; cursor:pointer; }
#views { display:flex; width:100vw; height:100vh; padding-top:36px; }
.view { flex:1; position:relative; border-right:1px solid #1e1e1e; overflow:hidden; }
.view canvas { display:block; position:absolute; top:0; left:0; z-index:0; }
.vlabel { position:absolute; top:40px; left:8px; z-index:50; background:rgba(0,0,0,0.8); color:#ccc; padding:4px 10px; border-radius:4px; font-size:11px; pointer-events:none; }
#loading { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:200; color:#06b6d4; font-size:16px; background:rgba(0,0,0,0.9); padding:12px 24px; border-radius:8px; display:none; }
</style></head><body>
<div id="navbar">
  <a href="/">Compare</a><a href="/labels">Labels</a><a href="/model">Model</a><a href="/infer" class="active">Infer</a>
</div>
<div id="toolbar">
  <select id="partSelect" style="max-width:260px"></select>
  <button id="btnInfer">Infer</button>
</div>
<div id="views">
  <div class="view" id="v0">
    <div class="vlabel">GAT Raw</div>
    <div id="leg0" style="position:absolute;top:70px;left:8px;z-index:50;display:flex;flex-direction:column;gap:2px"></div>
  </div>
  <div class="view" id="v1">
    <div class="vlabel">MLP Faces (GAT color)</div>
    <div id="leg1" style="position:absolute;top:70px;left:8px;z-index:50;display:flex;flex-direction:column;gap:2px"></div>
  </div>
  <div class="view" id="v2">
    <div class="vlabel">MLP Voted</div>
    <div id="leg2" style="position:absolute;top:70px;left:8px;z-index:50;display:flex;flex-direction:column;gap:2px"></div>
  </div>
</div>
<div id="loading">AI inferring...</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const N=3, scenes=[], renderers=[], cams=[], ctrls=[], groups=[], isRaw=[true,false,false];
let center=[0,0,0], span=1, sync=false;

function init(i, elId) {
  const el = document.getElementById(elId);
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0a0a0a);
  scenes[i]=scene;
  const r = new THREE.WebGLRenderer({antialias:true});
  r.setPixelRatio(Math.min(window.devicePixelRatio,2));
  r.domElement.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%';
  el.appendChild(r.domElement); renderers[i]=r;
  const cam = new THREE.PerspectiveCamera(35,1,0.01,100000);
  cam.position.set(1,0.6,1.5); cam.up.set(0,0,1);
  const ctrl = new OrbitControls(cam, r.domElement);
  ctrl.enableDamping = true; ctrl.target.set(0,0,0);
  ctrl.addEventListener('change',()=>{if(!sync){sync=true;for(let j=0;j<N;j++){if(j===i)continue;cams[j].position.copy(cam.position);cams[j].quaternion.copy(cam.quaternion);ctrls[j].target.copy(ctrl.target);ctrls[j].update()}sync=false;}});
  cams[i]=cam; ctrls[i]=ctrl;
  scene.add(new THREE.AmbientLight(0xffffff,3));
  const d1=new THREE.DirectionalLight(0xffffff,5);d1.position.set(1,1,1);scene.add(d1);
  groups[i]=new THREE.Group();scene.add(groups[i]);
}

function layout() {
  const W=window.innerWidth, H=window.innerHeight, cW=W/N;
  renderers.forEach((r,i)=>r.setSize(cW,H));
  cams.forEach(c=>{c.aspect=cW/H;c.updateProjectionMatrix();});
}

function clearAll() {
  groups.forEach(g=>{while(g.children.length){const c=g.children[0];if(c.geometry)c.geometry.dispose();if(c.material)c.material.dispose();g.remove(c);}});
}

function renderFaces(gi, data, edgeMode) {
  if (!data) return;
  data.forEach(f=>{
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.Float32BufferAttribute(f.vertices,3));
    if (f.face_colors) {
      // Per-vertex colors (middle panel: GAT raw colors)
      geo.setAttribute('color',new THREE.Float32BufferAttribute(f.face_colors,3));
      geo.setIndex(f.triangles);
      const mat=new THREE.MeshPhongMaterial({vertexColors:true,specular:0x222222,shininess:30,side:THREE.DoubleSide,flatShading:true});
      groups[gi].add(new THREE.Mesh(geo,mat));
      // Boundary lines
      if (f.boundary_lines && f.boundary_lines.length > 0) {
        const bgeo=new THREE.BufferGeometry();
        bgeo.setAttribute('position',new THREE.Float32BufferAttribute(f.boundary_lines,3));
        const bline=new THREE.LineSegments(bgeo, new THREE.LineBasicMaterial({color:0x000000,linewidth:2}));
        groups[gi].add(bline);
      }
    } else {
      geo.setIndex(f.triangles);
      geo.computeVertexNormals();
      const mat=new THREE.MeshPhongMaterial({color:new THREE.Color(f.color),specular:0x222222,shininess:30,side:THREE.DoubleSide,flatShading:true});
      groups[gi].add(new THREE.Mesh(geo,mat));
      if (edgeMode === 'wire') {
        const wire=new THREE.LineSegments(
          new THREE.WireframeGeometry(geo.clone()),
          new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:0.2})
        );
        groups[gi].add(wire);
      } else if (edgeMode === 'boundary') {
        const edges=new THREE.EdgesGeometry(geo, 30);
        const line=new THREE.LineSegments(edges, new THREE.LineBasicMaterial({color:0x000000,linewidth:1}));
        groups[gi].add(line);
      }
    }
  });
}

async function run(blob,name) {
  document.getElementById('loading').style.display='block';clearAll();
  const fd=new FormData();fd.append('stl',blob,name||'m.stl');
  const r=await fetch('/api/infer',{method:'POST',body:fd});const d=await r.json();
  if(d.error){alert(d.error);document.getElementById('loading').style.display='none';return;}
  center=d.center;span=d.span;
  renderFaces(0,d.raw_faces,'wire');
  renderFaces(1,d.mid_faces,'boundary');
  renderFaces(2,d.merged_faces,'boundary');
  for(let i=0;i<N;i++){
    ctrls[i].target.set(...center);
    const dist=span*2.5;
    cams[i].position.set(center[0]+dist*0.6,center[1]+dist*0.4,center[2]+dist*0.7);
    cams[i].lookAt(...center);ctrls[i].update();
  }
  const COLORS = {"plane":"#4db8ff","cylinder":"#44cc44","sphere":"#ff44ff","cone":"#ff8844","torus":"#ffcc00","freeform":"#888888"};
  function makeLegend(id) {
    return Object.entries(COLORS).map(([n,c])=>`<div style="display:flex;align-items:center;gap:6px;background:rgba(0,0,0,0.7);padding:2px 6px;border-radius:3px"><span style="width:12px;height:12px;border-radius:2px;background:${c}"></span><span style="color:#ccc;font-size:10px">${n}</span></div>`).join('');
  }
  document.getElementById('leg0').innerHTML = makeLegend();
  document.getElementById('leg1').innerHTML = makeLegend();
  document.getElementById('leg2').innerHTML = makeLegend();
  document.getElementById('v0').querySelector('.vlabel').textContent = `GAT Raw (${d.num_raw} groups)`;
  document.getElementById('v1').querySelector('.vlabel').textContent = `MLP Faces (${d.num_mid} regions)`;
  document.getElementById('v2').querySelector('.vlabel').textContent = `MLP Voted (${d.num_merged} faces)`;
  document.getElementById('loading').style.display='none';
}

init(0,'v0');init(1,'v1');init(2,'v2');
window.addEventListener('resize',layout);
document.getElementById('btnInfer').addEventListener('click',async()=>{
  const p=document.getElementById('partSelect').value;if(!p)return;
  const r=await fetch('/api/stl_raw/'+p);run(await r.blob(),p+'.stl');
});

(async()=>{
  const r=await fetch('/api/parts');const parts=await r.json();
  const sel=document.getElementById('partSelect');
  parts.slice(0,5000).forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;sel.appendChild(o)});
  const first=parts[Math.floor(Math.random()*parts.length)];sel.value=first;
  run(await (await fetch('/api/stl_raw/'+first)).blob(),first+'.stl');
})();

function animate(){requestAnimationFrame(animate);renderers.forEach((r,i)=>r.render(scenes[i],cams[i]));}
layout();animate();
</script></body></html>
