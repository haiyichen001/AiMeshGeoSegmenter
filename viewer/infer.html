<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>AI Inference</title>
<link rel="stylesheet" href="/theme.css"><style>
#toolbar { position:fixed; top:36px; right:16px; z-index:100; }
#legend { position:fixed; top:36px; left:16px; z-index:100; flex-direction:column; background:rgba(0,0,0,0.8); padding:8px 12px; border-radius:6px; }
#fileInput { display:none; }
</style>
</head>
<body>
<div id="navbar">
  <a href="/">Compare</a>
  <a href="/labels">Labels</a>
  <a href="/model">Model</a>
  <a href="/infer" class="active">Infer</a>
</div>
<div id="toolbar">
  <select id="partSelect" style="max-width:300px;padding:6px;background:#1a1a1a;color:#ccc;border:1px solid #444;border-radius:4px;font-size:13px"></select>
  <button id="btnInfer">Infer</button>
  <input type="file" id="fileInput" accept=".stl" style="display:none">
  <label for="fileInput" id="fileLabel" style="padding:6px 12px;font-size:13px;background:#1a1a1a;color:#ccc;border:1px solid #444;border-radius:4px;cursor:pointer">Upload</label>
</div>
<div id="legend"></div>
<div id="info"></div>
<div id="loading">AI inferring...</div>
<div id="dropzone">Drop STL file or <span onclick="document.getElementById('fileInput').click()">browse</span></div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

let scene, renderer, labelRenderer, cam, ctrl, group;

function initScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a0a);
  const w = window.innerWidth, h = window.innerHeight;
  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(w,h); renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  document.body.appendChild(renderer.domElement);
  labelRenderer = new CSS2DRenderer();
  labelRenderer.setSize(w,h); labelRenderer.domElement.style.position='absolute';
  labelRenderer.domElement.style.top='0'; labelRenderer.domElement.style.pointerEvents='none';
  document.body.appendChild(labelRenderer.domElement);
  cam = new THREE.PerspectiveCamera(35,w/h,0.001,1000);
  cam.position.set(1,0.6,1.5); cam.up.set(0,0,1);
  ctrl = new OrbitControls(cam, renderer.domElement);
  ctrl.enableDamping = true; ctrl.target.set(0,0,0);
  scene.add(new THREE.AmbientLight(0xffffff,3));
  const d1 = new THREE.DirectionalLight(0xffffff,3); d1.position.set(1,1,1); scene.add(d1);
  const d2 = new THREE.DirectionalLight(0x8888cc,2); d2.position.set(-0.5,-0.5,-0.5); scene.add(d2);
  group = new THREE.Group(); scene.add(group);
  window.addEventListener('resize',()=>{
    renderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    cam.aspect = window.innerWidth/window.innerHeight; cam.updateProjectionMatrix();
  });
}

function clearGroup() {
  while(group.children.length > 0) {
    const c = group.children[0];
    if (c.geometry) c.geometry.dispose();
    if (c.material) { if (Array.isArray(c.material)) c.material.forEach(m=>m.dispose()); else c.material.dispose(); }
    group.remove(c);
  }
  document.getElementById('legend').innerHTML = '';
  document.getElementById('info').textContent = '';
}

async function runInference(stlBlob, filename) {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('dropzone').style.display = 'none';
  clearGroup();

  const form = new FormData();
  form.append('stl', stlBlob, filename || 'model.stl');

  const r = await fetch('/api/infer', { method: 'POST', body: form });
  const d = await r.json();
  if (d.error) { alert('Error: ' + d.error); document.getElementById('loading').style.display = 'none'; return; }

  // Legend
  const typeCount = {};
  d.faces.forEach(f => {
    if (!typeCount[f.type]) typeCount[f.type] = { color: f.color, count: 0 };
    typeCount[f.type].count++;
  });
  const legend = document.getElementById('legend');
  legend.innerHTML = Object.entries(typeCount).map(([t, info]) =>
    `<div class="item"><span class="dot" style="background:${info.color}"></span>${t} (${info.count})</div>`
  ).join('');

  // Render
  d.faces.forEach(f => {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(f.vertices, 3));
    geo.setIndex(f.triangles);
    geo.computeVertexNormals();
    const mat = new THREE.MeshPhongMaterial({
      color: new THREE.Color(f.color), specular: 0x000000, shininess: 0,
      side: THREE.DoubleSide, transparent: true, opacity: 0.55, depthWrite: false
    });
    group.add(new THREE.Mesh(geo, mat));

    const div = document.createElement('div');
    div.textContent = f.type;
    div.style.cssText = `color:${f.color};font-size:10px;font-weight:bold;background:rgba(0,0,0,0.7);padding:2px 6px;border-radius:3px;white-space:nowrap;pointer-events:none`;
    const label = new CSS2DObject(div);
    label.position.set(...f.center);
    group.add(label);
  });

  cam.position.set(d.center[0] + d.span * 0.6, d.center[1] + d.span * 0.4, d.center[2] + d.span * 0.7);
  ctrl.target.set(...d.center); ctrl.update();
  document.getElementById('info').textContent = `${filename || 'STL'} | ${d.num_patches} patches`;
  document.getElementById('loading').style.display = 'none';
}

// File input
document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (file) runInference(file, file.name);
});

// Drag & drop
document.body.addEventListener('dragover', e => { e.preventDefault(); });
document.body.addEventListener('drop', e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file && file.name.toLowerCase().endsWith('.stl')) {
    runInference(file, file.name);
  }
});

// Load parts list and populate dropdown
async function initParts() {
  const r = await fetch('/api/parts');
  const parts = await r.json();
  const sel = document.getElementById('partSelect');
  const groups = {};
  parts.forEach(p => {
    let g = 'ABC';
    const pfxs = ['HexagonNut','HexHeadBolt','SocketHeadCap','Countersunk','PanHead','SetScrew',
      'PlainWasher','ChamferedWasher','DeepGroove','CappedDeep','AngularContact',
      'CylindricalRoller','TaperedRoller','SpurGear','BevelGear','CrossedHelical',
      'RackGear','RingGear','WormGear'];
    for (const pf of pfxs) { if (p.includes(pf)) { g = pf; break; } }
    if (!groups[g]) groups[g] = [];
    groups[g].push(p);
  });
  for (const g of Object.keys(groups).sort()) {
    const og = document.createElement('optgroup');
    og.label = g + ' (' + groups[g].length + ')';
    groups[g].forEach(p => { const o = document.createElement('option'); o.value = p; o.textContent = p; og.appendChild(o); });
    sel.appendChild(og);
  }
  // Auto-infer random part
  const allParts = parts;
  const target = allParts[Math.floor(Math.random() * allParts.length)];
  sel.value = target;
  const stlResp = await fetch('/api/stl_raw/' + target);
  const blob = await stlResp.blob();
  runInference(blob, target + '.stl');
}

// Infer button
document.getElementById('btnInfer').addEventListener('click', async () => {
  const target = document.getElementById('partSelect').value;
  const stlResp = await fetch('/api/stl_raw/' + target);
  const blob = await stlResp.blob();
  runInference(blob, target + '.stl');
});

initParts();

function animate() { requestAnimationFrame(animate); ctrl.update(); renderer.render(scene,cam); labelRenderer.render(scene,cam); }

initScene(); animate();
</script>
</body>
</html>
